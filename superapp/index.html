<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#5e1a84" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="نسخه وب واکنش‌گرای سوپراپلیکیشن یولدا برای سفارش غذا، سوپرمارکت، داروخانه، ارسال شهری و پیشنهاد هوشمند در ارومیه"
    />
    <title>یولدا — سوپراپلیکیشن شهری</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/brand/yolda-logo.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/yolda-logo.png">
    <link rel="preload" href="assets/brand/yolda-logo.png" as="image" type="image/png" />
    <link rel="preload" href="assets/fonts/Dana-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/Dana-DemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        const allowed = new Set(["light", "dark", "system"]);
        let preference = "system";
        try {
          const keys = ["yolda-real-site-state-v3", "yolda-real-site-state-v2", "yolda-static-prototype-state-v1"];
          for (const key of keys) {
            const stored = JSON.parse(localStorage.getItem(key));
            if (allowed.has(stored?.theme)) {
              preference = stored.theme;
              break;
            }
          }
        } catch (error) {
          preference = "system";
        }
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/main.css?v=29" />
    <link rel="stylesheet" href="assets/css/responsive.css?v=29" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/data.js?v=29" defer></script>
    <script src="assets/js/recommender.js" defer></script>
    <script src="assets/js/pages.js?v=29" defer></script>
    <script src="assets/js/app.js?v=29" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#page-content">رفتن به محتوای اصلی</a>
    <div
      id="page-loader"
      class="app-loader page-loader is-visible"
      role="status"
      aria-live="polite"
      aria-label="در حال بارگذاری صفحه"
    >
      <div class="loader-card">
        <div class="loader-visual" aria-hidden="true">
          <video class="loader-video" data-loader-video muted loop autoplay playsinline preload="auto"></video>
          <div class="loader-fallback">
            <span class="loader-orbit"></span>
            <span class="loader-core loader-brand-core"><img src="assets/brand/yolda-logo.png" alt="" /></span>
          </div>
        </div>
        <strong>یولدا در راهه</strong>
        <span class="loader-message">در حال آماده‌کردن صفحه…</span>
        <span class="loader-progress" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <div
      id="ai-loader"
      class="app-loader ai-loader"
      role="status"
      aria-live="polite"
      aria-label="در حال ساخت پیشنهاد هوشمند"
      hidden
    >
      <div class="loader-card ai-loader-card">
        <div class="loader-visual" aria-hidden="true">
          <video class="loader-video" data-loader-video muted loop autoplay playsinline preload="auto"></video>
          <div class="loader-fallback ai-loader-fallback">
            <span class="ai-spark spark-one">✦</span>
            <span class="ai-spark spark-two">✦</span>
            <span class="ai-spark spark-three">✦</span>
            <img src="assets/icons/yld-discover-recommended.webp" alt="" />
          </div>
        </div>
        <strong>پیشنهاد هوشمند یولدا</strong>
        <span class="loader-message">دارم سلیقه و گزینه‌های موجود را بررسی می‌کنم…</span>
        <span class="loader-progress" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <div id="app" aria-live="polite" aria-busy="true"></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>
      <style>.app-loader { display: none !important; }</style>
      <div class="noscript">برای اجرای نسخه وب یولدا، JavaScript مرورگر را فعال کنید.</div>
    </noscript>
  </body>
</html>
