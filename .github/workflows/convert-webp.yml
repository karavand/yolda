name: Convert PNG icons to WebP

on:
  push:
    branches:
      - main
    paths:
      - "assets/icons/**/*.png"
      - "assets/icons/**/*.PNG"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Convert PNG icons to WebP
        run: |
          python scripts/convert_to_webp.py

      - name: Commit converted WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: convert PNG icons to WebP"
            git push
          fi
